[project]
name = "safevault-backend"
version = "1.0.0"
description = "SafeVault 模块 1：云账户与认证后端（当前实现下发邮箱验证码）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Web 框架与服务器
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.34.0",
    # 配置与校验
    "pydantic>=2.10.4",
    "pydantic-settings>=2.7.1",
    "email-validator>=2.2.0",       # 提供 pydantic EmailStr 邮箱格式校验
    # MySQL（SQLAlchemy 2.0 异步 ORM + asyncmy 驱动）
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncmy>=0.2.9",
    # Redis（异步客户端，验证码 / 冷却 / 限流）
    "redis>=5.2.1",
    # RabbitMQ（异步生产者 / 消费者）
    "aio-pika>=9.5.4",
    # Brevo 事务邮件 HTTP API 调用（运行时发信；测试 TestClient 亦复用 httpx）
    "httpx>=0.28.1",
]

[dependency-groups]
# 开发/联调依赖：uv sync 默认安装；生产部署用 `uv sync --no-dev` 跳过
# httpx 已上提为运行时依赖（Brevo 发信），测试 TestClient 直接复用，无需在此重复声明
dev = []

[tool.uv]
# 本工程是应用而非可发布的库：app / worker 以源码目录形式从工程根运行，
# 不需要把根目录当作可安装包构建。
package = false
